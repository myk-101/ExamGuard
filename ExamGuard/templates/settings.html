<!DOCTYPE html>
<html>
<head>
    <title>ExamGuard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/settings.css">
    <link rel="stylesheet" href="/static/css/settings_css/account.css">
    <link rel="stylesheet" href="/static/css/settings_css/camera.css">
    <link rel="stylesheet" href="/static/css/settings_css/alert.css">
    <link rel="stylesheet" href="/static/css/settings_css/data.css">
    <link rel="stylesheet" href="/static/css/settings_css/change_pass.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<style>
body{
    margin: 0%;
}
</style>

<body>

{% block content %}

<div class="settings-container">

    <div class="mobile-header">
        <a href="{{ url_for('dashboard') }}" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>

        <h3>Settings</h3>

        <button class="burger-btn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="settings-sidebar" id="mobileSidebar">
        <div class="sidebar-links">
            <a href="{{ url_for('dashboard') }}" class="btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <a href="{{ url_for('account') }}"
            class="btn {% if request.endpoint == 'account' %}active{% endif %}">
            Account
            </a>
            <a href="{{ url_for('camera_settings') }}"
            class="btn {% if request.endpoint == 'camera_settings' %}active{% endif %}">
            Camera
            </a>
            <a href="{{ url_for('alerts_settings') }}"
            class="btn {% if request.endpoint == 'alerts_settings' %}active{% endif %}">
            Alert sounds
            </a>
            <a href="{{ url_for('data_settings') }}"
            class="btn {% if request.endpoint == 'data_settings' %}active{% endif %}">
            Data / Records
            </a>
            <a href="{{ url_for('logout') }}" class="logout">Log out</a>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="settings-container1">
        <div class="settings-content">
            {% block settings_content %}
            {% endblock %}
        </div>
    </div>

</div>
<script>
function toggleSidebar() {
    document.getElementById("mobileSidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}
</script>
{% endblock %}

{% block scripts %}{% endblock %}

</body>
</html>
